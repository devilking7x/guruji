services:
  - type: web
    name: guruji
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter guruji-server build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: LLM_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct
      - key: LLM_PRICE_INPUT_PER_1M
        value: "0.2"
      - key: LLM_PRICE_OUTPUT_PER_1M
        value: "0.6"
      - key: GURUJI_IP_DAILY_CAP_USD
        value: "0.15"
      - key: GURUJI_AUTO_REMEMBER
        value: "1"
      # Secrets are NEVER committed. Set these in the Render dashboard:
      - key: LLM_API_KEY
        sync: false
